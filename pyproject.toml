[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlasmind-ai"
version = "0.11.0"
description = "A direct-HTML knowledge crawler and locally grounded multimodal AI system"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "joblib>=1.4,<2",
    "numpy>=2.0,<3",
    "num2words>=0.5.14,<1",
    "pillow>=10.4,<12",
    "pydantic-settings>=2.5,<3",
    "pgvector>=0.3,<1",
    "psycopg[binary]>=3.2,<4",
    "scikit-learn>=1.5,<2",
    "torch>=2.4,<3",
    "torchvision>=0.19,<1",
    "transformers>=4.57,<5",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
advanced-ml = ["imbalanced-learn>=0.12,<1", "lightgbm>=4.5,<5", "xgboost>=2.1,<3"]
vision = ["opencv-python-headless>=4.10,<5", "pillow>=10.4,<12"]
mlops = ["mlflow>=2.16,<3"]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.6,<1",
    "types-beautifulsoup4>=4.12,<5",
]

[project.scripts]
atlasmind = "atlasmind.cli:main"
atlasmind-dev = "atlasmind.dev_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
